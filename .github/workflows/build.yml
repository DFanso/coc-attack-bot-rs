name: Build

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Rename binary
        shell: bash
        run: |
          mv target/x86_64-pc-windows-msvc/release/coc-attack-bot.exe coc-attack-bot-windows.exe

      - uses: actions/upload-artifact@v5
        with:
          name: coc-attack-bot-windows
          path: coc-attack-bot-windows.exe
          retention-days: 30

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: coc-attack-bot-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: coc-attack-bot-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
